name: Prepare signed release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on this main commit, for example v0.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      issues: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release version and existing tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          grep -F "versionName = \"${RELEASE_TAG#v}\"" app/build.gradle.kts
      - name: Refuse unresolved release blockers
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh issue list --label release-blocker --state open --json number --jq length)" = 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LOOPO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/loopo.jks"
          chmod 600 "$RUNNER_TEMP/loopo.jks"
      - name: Build signed APK
        env:
          LOOPO_KEYSTORE_PATH: ${{ runner.temp }}/loopo.jks
          LOOPO_KEYSTORE_PASSWORD: ${{ secrets.LOOPO_KEYSTORE_PASSWORD }}
          LOOPO_KEY_ALIAS: ${{ secrets.LOOPO_KEY_ALIAS }}
          LOOPO_KEY_PASSWORD: ${{ secrets.LOOPO_KEY_PASSWORD }}
        run: bash gradlew assembleRelease --no-daemon --console=plain
      - name: Verify signed artifact
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_apk.py app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "loopo-$RELEASE_TAG.apk"
          sha256sum "loopo-$RELEASE_TAG.apk" > SHA256SUMS
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "loopo-$RELEASE_TAG.apk" SHA256SUMS LICENSE --draft --verify-tag --title "Loopo $RELEASE_TAG" --generate-notes
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/loopo.jks"
