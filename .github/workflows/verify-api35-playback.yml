name: Verify Android 15 playback at 16 KiB

on:
  push:
    branches: [codex/verify-api35-playback]

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QEMU_AUDIO_DRV: wav
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build the debug playback check
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          cp app/src/androidTest/java/com/p33nah/loopo/data/audio/WavFixture.kt app/src/debug/java/com/p33nah/loopo/data/audio/
          bash gradlew assembleDebug --console=plain
          mkdir -p evidence
          echo "QEMU_WAV_PATH=$PWD/evidence/emulator-output.wav" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^ > evidence/build.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk >> evidence/build.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk > evidence/zipalign.txt
          python3 scripts/verify_apk.py app/build/outputs/apk/debug/app-debug.apk > evidence/apk-alignment.txt
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash .github/verify-api35-playback.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: android-15-16k-playback
          path: evidence/
          retention-days: 7
